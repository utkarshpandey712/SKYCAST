server.port=${PORT:8080}
# Make error messages (e.g. "City not found") reach the frontend
server.error.include-message=always
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
spring.web.resources.cache.cachecontrol.max-age=1h
# IMPORTANT: set APP_BASE_URL to your real domain after deployment, e.g. https://skycast.in
app.base-url=${APP_BASE_URL:http://localhost:8080}
